name: Playwright collaboration

# Browser/collaboration tests (AP5). These need a live Moodle site, so they run
# separately from the moodle-plugin-ci static pipeline. Manual and scheduled by
# default to keep PR runs fast; enable on push if you want it on every change.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5

    env:
      MOODLE_BRANCH: MOODLE_405_STABLE
      DB: pgsql

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, gd, intl, zip, soap, mbstring
          ini-values: max_input_vars=5000

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out Moodle
        run: git clone --depth 1 --branch "$MOODLE_BRANCH" https://github.com/moodle/moodle.git moodle

      - name: Install plugin into Moodle
        run: cp -a plugin moodle/mod/vimipad

      - name: Install Moodle site
        run: |
          cd moodle
          php admin/cli/install.php \
            --non-interactive \
            --agree-license \
            --dbtype=pgsql \
            --dbhost=127.0.0.1 \
            --dbname=moodle \
            --dbuser=moodle \
            --dbpass=moodle \
            --wwwroot=http://127.0.0.1:8000 \
            --dataroot=/tmp/moodledata \
            --fullname="CI" \
            --shortname="CI" \
            --adminpass="Admin!23" \
            --adminemail=ci@example.invalid

      - name: Start Moodle web server
        run: |
          cd moodle
          php -S 127.0.0.1:8000 -t . >/tmp/moodle-server.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/login/index.php >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Moodle web server did not become ready."
          cat /tmp/moodle-server.log
          exit 1

      - name: Seed collaboration fixture
        id: seed
        run: |
          cd moodle
          php mod/vimipad/tests/playwright/seed.php > /tmp/vimipad-seed.env
          source /tmp/vimipad-seed.env
          env | grep '^VIMIPAD_' >> "$GITHUB_ENV"

      - name: Install Playwright and browsers
        run: |
          cd moodle/mod/vimipad/tests/playwright
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          VIMIPAD_BASE_URL: http://127.0.0.1:8000
        run: |
          cd moodle/mod/vimipad/tests/playwright
          npm test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: moodle/mod/vimipad/tests/playwright/playwright-report
          retention-days: 7
