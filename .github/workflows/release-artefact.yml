# Release artefact - mod_vimipad
#
# Builds the distributable ZIP from a tag and attaches it to a GitHub Release,
# following the release design of moodle-mod_elang.
#
# It replaces the former "Build release package" workflow. That one uploaded
# vimipad.zip as an ordinary artifact, and GitHub wraps every artifact in a ZIP
# of its own - the download was a ZIP inside a ZIP, which browsers flag as
# potentially malicious. Here the package is uploaded with archive: false, so
# the file you download is the plugin itself.
#
# It deliberately does not rebuild committed artefacts: amd/build is part of
# the repository, and a release job that rebuilt it would publish something
# nobody had tested.

name: Release artefact

on:
  push:
    tags:
      - 'v1.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional: a different tag, branch or commit. Empty = the ref selected above.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: release-artefact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artefact:
    name: Build and validate the release ZIP
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.zip.outputs.name }}
      internid: ${{ steps.intern.outputs.artifact-id }}
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      maturity: ${{ steps.version.outputs.maturity }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      - name: Move to the ref this release is built from
        id: ref
        run: |
          cd plugin
          ref="${{ github.event.inputs.ref || github.ref }}"
          if ! resolved=$(git rev-parse --verify --quiet "${ref}^{commit}"); then
            echo "'$ref' laesst sich in diesem Repository nicht aufloesen."
            git tag --list | tail -10
            exit 1
          fi
          git checkout --detach "$resolved"
          echo "Gebaut wird aus $resolved"
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a commit the pipeline never passed
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit that was tested must be the commit that was tagged. Only
          # conclusions count, so a run still in progress is not a pass; this
          # job is excluded, or it would wait for itself.
          sha="${{ github.sha }}"
          runs=$(gh api --paginate \
            "repos/${{ github.repository }}/commits/$sha/check-runs" \
            --jq '.check_runs[] | select(.name != "${{ github.job }}") | [.name, .status, (.conclusion // "pending")] | @tsv')
          if [ -z "$runs" ]; then
            echo "Fuer diesen Commit gibt es keine Check-Runs - nicht veroeffentlichen."
            exit 1
          fi
          echo "$runs" | while IFS=$'\t' read -r name status conclusion; do
            printf '  %-40s %-12s %s\n' "$name" "$status" "$conclusion"
          done
          bad=$(echo "$runs" | awk -F'\t' '
            $2 != "completed" { print; next }
            $3 != "success" && $3 != "neutral" && $3 != "skipped" { print }
          ')
          if [ -n "$bad" ]; then
            echo "Nicht abgeschlossene oder fehlgeschlagene Laeufe:"
            echo "$bad"
            exit 1
          fi
          echo "Alle Check-Runs auf $sha sind abgeschlossen und gruen."

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the declared version
        id: version
        run: |
          # version.php starts with defined(MOODLE_INTERNAL) || die() and uses
          # Moodle constants; both are supplied so it can be read outside Moodle.
          read_version() {
            php -r '
              define("MOODLE_INTERNAL", true);
              define("MATURITY_ALPHA", 50);
              define("MATURITY_BETA", 100);
              define("MATURITY_RC", 150);
              define("MATURITY_STABLE", 200);
              $plugin = new stdClass();
              require "plugin/version.php";
              echo $plugin->{$argv[1]};
            ' -- "$1"
          }
          release=$(read_version release)
          version=$(read_version version)
          maturity=$(read_version maturity)
          if [ -z "$release" ] || [ -z "$version" ] || [ -z "$maturity" ]; then
            echo "version.php liess sich nicht auslesen:"
            echo "  release='$release' version='$version' maturity='$maturity'"
            exit 1
          fi
          echo "release=$release"   >> "$GITHUB_OUTPUT"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "maturity=$maturity" >> "$GITHUB_OUTPUT"
          echo "release=$release version=$version maturity=$maturity"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "Kein Tag-Lauf ($GITHUB_REF) - der Tag-Abgleich entfaellt."; exit 0 ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "v$release" ]; then
            echo "Der Tag '$tag' passt nicht zu \$plugin->release ('$release'). Erwartet: 'v$release'."
            exit 1
          fi

      - name: Check that the version number carries the release date
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Checked, not written: rewriting version.php here would put a number
          # in the ZIP that no commit contains.
          version="${{ steps.version.outputs.version }}"
          versiondate="${version:0:8}"
          commitdate=$(git -C plugin log -1 --format=%cd --date=format:%Y%m%d "${{ github.sha }}")
          if [ "$versiondate" != "$commitdate" ]; then
            echo "version.php traegt $versiondate, der getaggte Commit stammt vom $commitdate."
            echo "Setzen Sie \$plugin->version auf ${commitdate}00 und taggen Sie neu."
            exit 1
          fi
          echo "Versionsdatum $versiondate stimmt mit dem getaggten Commit ueberein."

      - name: Verify the committed editor bundle matches its sources
        run: |
          # Not rebuilt - verified. Publishing a freshly built bundle would ship
          # something no test ever ran against.
          cd plugin
          npm ci
          before=$(sha256sum amd/build/editor_lazy.min.js | cut -d' ' -f1)
          node build.mjs
          after=$(sha256sum amd/build/editor_lazy.min.js | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "Das eingecheckte Editor-Bundle entspricht nicht seinen Quellen."
            echo "committed: $before"
            echo "rebuilt:   $after"
            exit 1
          fi
          git checkout -- amd/build 2>/dev/null || true
          echo "Bundle reproduzierbar: $before"

      - name: Build the ZIP
        id: zip
        run: |
          # git archive honours .gitattributes export-ignore, so this archive and
          # the one GitHub generates for a tag contain the same files.
          mkdir -p dist
          git -C plugin archive --format=tar --prefix=vimipad/ HEAD | tar -x -C dist
          for junk in node_modules tests/playwright/node_modules; do
            if [ -e "dist/vimipad/$junk" ]; then
              echo "Unerwartet im Archiv: $junk"
              exit 1
            fi
          done
          name="moodle-mod_vimipad-${{ steps.version.outputs.release }}-${{ steps.version.outputs.version }}.zip"
          (cd dist && zip -qr "../$name" vimipad)
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          unzip -l "$name" | tail -2

      - name: Refuse to publish a ZIP containing translations or build leftovers
        run: |
          # Only English ships; AMOS is the authority for every other language.
          # A name after lang/ is required, or the lang/ entry itself matches.
          # Files only: an empty directory left by export-ignore is harmless.
          if unzip -Z1 "${{ steps.zip.outputs.name }}" | grep -v '/$' | grep -P '/lang/(?!en/)[a-z]'; then
            echo "Das Archiv enthaelt Sprachpakete ausser Englisch."
            exit 1
          fi
          if unzip -l "${{ steps.zip.outputs.name }}" | grep -E 'node_modules|/\.git/|tests/playwright/'; then
            echo "Das Archiv enthaelt Artefakte, die nicht ausgeliefert werden duerfen."
            exit 1
          fi
          echo "Keine Fremdartefakte im Archiv."

      - name: Refuse to publish an archive with the wrong root directory
        run: |
          # Moodle installs by the root folder: exactly one, named "vimipad".
          # core\update\validator rejects anything else with rootdirinvalid.
          roots=$(unzip -Z1 "${{ steps.zip.outputs.name }}" | cut -d/ -f1 | sort -u)
          if [ "$(echo "$roots" | wc -l)" != "1" ] || [ "$roots" != "vimipad" ]; then
            echo "Das Archiv muss genau ein Wurzelverzeichnis 'vimipad' haben. Gefunden:"
            echo "$roots" | sed 's/^/  /'
            exit 1
          fi
          echo "Wurzelverzeichnis: vimipad"

      - name: Refuse to publish without the files a site needs at runtime
        run: |
          missing=""
          for path in \
            vimipad/version.php \
            vimipad/LICENSE \
            vimipad/thirdpartylibs.xml \
            vimipad/lang/en/vimipad.php \
            vimipad/amd/build/init.min.js \
            vimipad/amd/build/editor_lazy.min.js
          do
            if ! unzip -l "${{ steps.zip.outputs.name }}" | grep -qF " $path"; then
              missing="$missing $path"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Im Archiv fehlen Dateien, die zur Laufzeit gebraucht werden:$missing"
            exit 1
          fi
          echo "Alle Pflichtdateien im Archiv vorhanden."

      - name: Refuse to publish a stable tag that is not declared stable
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          release="${{ steps.version.outputs.release }}"
          maturity="${{ steps.version.outputs.maturity }}"
          case "$release" in
            *RC*|*beta*|*alpha*) echo "Vorabversion ($release)."; exit 0 ;;
          esac
          if [ "$maturity" != "200" ]; then
            echo "Release '$release' ist kein Vorabrelease, version.php meldet aber maturity $maturity statt 200."
            exit 1
          fi
          echo "Release $release ist als MATURITY_STABLE deklariert."

      - name: Keep the artefact for the install check
        id: intern
        uses: actions/upload-artifact@v4
        with:
          name: intern-pruefpaket
          path: |
            ${{ steps.zip.outputs.name }}
            ${{ steps.zip.outputs.name }}.sha256
          retention-days: 7

      - name: Say where the archive is
        run: |
          name="${{ steps.zip.outputs.name }}"
          sum=$(cut -d' ' -f1 < "$name.sha256")
          {
            echo "## Release-Artefakt"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Datei | \`$name\` |"
            echo "| SHA-256 | \`$sum\` |"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Release | ${{ steps.version.outputs.release }} |"
            echo
            echo "Nach den Pruefjobs liegt \`$name\` unten unter **Artifacts** -"
            echo "direkt installierbar, ohne zusaetzliche ZIP-Huelle."
          } >> "$GITHUB_STEP_SUMMARY"

  install:
    name: Install the actual ZIP into a clean Moodle
    needs: artefact
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, zip, gd, intl, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Check out Moodle
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_405_STABLE
          path: moodle

      - name: Download the release ZIP
        uses: actions/download-artifact@v4
        with:
          name: intern-pruefpaket
          path: artefact

      - name: Confirm the checksum before trusting the archive
        run: |
          cd artefact
          name=$(ls ./*.zip)
          sha256sum -c "$name.sha256"

      - name: Unpack the ZIP into Moodle, as a site administrator would
        run: |
          cd artefact
          unzip -q ./*.zip -d ../moodle/mod
          test -f ../moodle/mod/vimipad/version.php
          echo "Entpackt nach mod/vimipad - Wurzelordner stimmt."

      - name: Install a fresh site with the plugin from the ZIP
        run: |
          mkdir -p moodledata
          php moodle/admin/cli/install.php \
            --non-interactive --agree-license \
            --wwwroot=http://127.0.0.1:8000 \
            --dataroot="$PWD/moodledata" \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --fullname="Release check" --shortname=rc \
            --adminpass=Sup3rS3cret! --adminemail=admin@example.invalid

      - name: Ask Moodle whether the plugin is installed and its schema is sound
        run: |
          php moodle/admin/cli/upgrade.php --non-interactive
          php moodle/admin/cli/check_database_schema.php
          php -r '
            define("CLI_SCRIPT", true);
            require "moodle/config.php";
            $installed = $DB->get_field("config_plugins", "value",
                ["plugin" => "mod_vimipad", "name" => "version"]);
            if (!$installed) {
                fwrite(STDERR, "mod_vimipad ist nicht installiert.\n");
                exit(1);
            }
            $plugin = new stdClass();
            require "moodle/mod/vimipad/version.php";
            if ((string) $installed !== (string) $plugin->version) {
                fwrite(STDERR, "Installierte Version $installed weicht von version.php "
                    . $plugin->version . " ab.\n");
                exit(1);
            }
            printf("mod_vimipad %s (build %d) installiert, Reifegrad %d.\n",
                $plugin->release, $plugin->version, $plugin->maturity);
          '

  publish:
    name: Publish the release
    needs: [artefact, install]
    runs-on: ubuntu-24.04
    steps:
      - name: Download the release ZIP
        uses: actions/download-artifact@v4
        with:
          name: intern-pruefpaket

      # archive: false uploads each file as itself. Without it GitHub wraps the
      # plugin ZIP in a second ZIP - the nested archive browsers flagged as
      # malware. The input needs upload-artifact v7.
      - name: Offer the plugin package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ needs.artefact.outputs.name }}
          archive: false
          retention-days: 30

      - name: Offer its checksum
        uses: actions/upload-artifact@v7
        with:
          path: ${{ needs.artefact.outputs.name }}.sha256
          archive: false
          retention-days: 30

      - name: Remove the internal copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ needs.artefact.outputs.internid }}"
          if [ -n "$id" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "Internes Pruefpaket entfernt."
          fi

      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ needs.artefact.outputs.name }}
            ${{ needs.artefact.outputs.name }}.sha256
          prerelease: ${{ contains(needs.artefact.outputs.release, 'RC') || contains(needs.artefact.outputs.release, 'beta') }}
          body: |
            **mod_vimipad ${{ needs.artefact.outputs.release }}** - build `${{ needs.artefact.outputs.version }}`

            | | |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Moodle | 4.5 LTS bis 5.3 |
            | PHP | 8.1 bis 8.3 (Moodle 5.3: 8.3) |
            | Reifegrad | `${{ needs.artefact.outputs.maturity }}` (200 = MATURITY_STABLE) |
            | Pruefsumme | SHA-256, als eigene Datei beigelegt |

            Dieses Archiv wurde aus dem getaggten Commit erzeugt und in eine
            frische Moodle-Installation entpackt und installiert, bevor es hier
            erschien. Die Pruefsumme gehoert zu genau dieser Datei.
